name: printers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about 10 minutes and apt has taken up to 9 for ffmpeg; 15 cancelled #21 and #25 mid-suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The watch tests check the timelapse MP4 with ffmpeg and ffprobe; without them that test is skipped.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
        timeout-minutes: 12
      - run: uv run --python 3.12 pytest -v --durations=10 -o faulthandler_timeout=120
      # Every shared printer pack must pass its check: a refusal fails the build; findings are printed for the
      # reviewer, who compares them with the ones listed in the pull request (profiles/community/README.md).
      - run: uv run --python 3.12 gantrel-printer pack check profiles/community/*.json
