[project]
name = "gantrel-printer"
version = "0.1.0"
description = "Gantrel printer and camera CLI: one safe interface to Klipper, OctoPrint, PrusaLink, Bambu Lab LAN and Creality printers"
readme = "docs/PRINTERS.md"
license = "MIT"
requires-python = ">=3.11"
# Licenses (docs/STACK.md rule: link only MIT, Apache, BSD, LGPL):
#   HTTP is the Python standard library (no certifi, which is MPL-2.0). websockets BSD-3-Clause, paho-mqtt EPL-2.0 OR EDL-1.0 (used under EDL-1.0,
#   which is BSD-3-Clause), zeroconf LGPL-2.1, keyring MIT.
dependencies = [
    "websockets>=13",
    "paho-mqtt>=2.1",
    "zeroconf>=0.132",
    "keyring>=25",
]

[project.scripts]
gantrel-printer = "gantrel_printer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gantrel_printer"]

[tool.pytest.ini_options]
testpaths = ["tests/printers", "tests/skills/printers"]
