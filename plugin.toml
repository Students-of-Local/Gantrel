id = "gantrel"
name = "Gantrel"
version = "0.3.0"
description = "Gantrel for Local Studio: design 3D printable parts with a local model and the smoothstone recipes, see and adjust them live in Gantrel Studio, then slice, upload and watch them on your printers"
skills = "skills/plugin"
capabilities = ["mcp-server", "ask-user"]

[mcp]
command = "bin/gantrel-mcp"

[[commands]]
name = "gantrel"
description = "Make a printable part"
skill = "smoothstone"

[[commands]]
name = "print"
description = "Slice, upload and watch a print on your printer"
skill = "printers"

[[commands]]
name = "studio"
description = "See and adjust the part in 3D"
skill = "studio"

[[commands]]
name = "plan"
description = "Plan a print: orientation, supports, time, filament and a settings check"
skill = "print-plan"
